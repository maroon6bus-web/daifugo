<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大富豪 - Daifugo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Sans+JP:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div id="game-container">
        <header>
            <h1>大富豪</h1>
            <div class="header-controls">
                <select id="bgm-selector" class="glass-select">
                    <option value="none">BGMを選択...</option>
                    <optgroup label="モーツァルト">
                        <option value="mozart_pianosonata15">ピアノソナタ第15番 第1楽章</option>
                        <option value="mozart_pianoconcerto21">ピアノ協奏曲第21番 第3楽章</option>
                        <option value="mozart_pianoconcerto26">ピアノ協奏曲第26番「戴冠式」</option>
                    </optgroup>
                    <optgroup label="ショパン">
                        <option value="chopin_kareinaru">華麗なる大円舞曲</option>
                        <option value="chopin_koinunowaltz">子犬のワルツ</option>
                        <option value="chopin_nocturne9_2">ノクターン op.9-2</option>
                    </optgroup>
                </select>
                <button id="sound-toggle" class="icon-btn">🔇</button>
                <div class="status-panel">
                    <span id="turn-indicator">ゲームを開始してください</span>
                </div>
            </div>
        </header>

        <main id="game-board">
            <!-- CPU 2 (Top) -->
            <section id="player-2" class="player-area top">
                <div class="hand-container" id="hand-2"></div>
                <div class="player-info">
                    <span class="avatar">🐻</span>
                    <span class="name">BEAR</span>
                    <span class="rank-label hidden"></span>
                </div>
            </section>

            <!-- CPU 1 (Left) -->
            <section id="player-1" class="player-area left">
                <div class="player-info">
                    <span class="avatar">🦊</span>
                    <span class="name">FOX</span>
                    <span class="rank-label hidden"></span>
                </div>
                <div class="hand-container" id="hand-1"></div>
            </section>

            <!-- Play Area (Center) -->
            <section id="table-area">
                <div id="field-cards"></div>
                <div id="message-overlay" class="hidden"></div>
                <div id="special-overlay" class="hidden"></div>
            </section>

            <!-- CPU 3 (Right) -->
            <section id="player-3" class="player-area right">
                <div class="player-info">
                    <span class="avatar">🐰</span>
                    <span class="name">RABBIT</span>
                    <span class="rank-label hidden"></span>
                </div>
                <div class="hand-container" id="hand-3"></div>
            </section>

            <!-- Player 0 (Bottom - You) -->
            <section id="player-0" class="player-area bottom">
                <div class="action-controls hidden" id="action-controls">
                    <button id="play-btn" class="primary-btn small">出す</button>
                    <button id="pass-btn" class="secondary-btn small">パス</button>
                </div>
                <div class="player-info">
                    <span class="avatar">👤</span>
                    <span class="name">YOU</span>
                    <span class="rank-label hidden"></span>
                </div>
                <div class="hand-container" id="hand-0"></div>
            </section>
        </main>

        <div id="controls">
            <button id="start-btn" class="primary-btn">ゲーム開始</button>
            <button id="restart-btn" class="secondary-btn hidden">もう一度遊ぶ</button>
        </div>

        <!-- Screen Overlays -->
        <div id="result-overlay" class="overlay hidden">
            <div class="result-content">
                <h2 id="result-title"></h2>
                <div id="rank-list"></div>
                <button id="play-again-btn" class="primary-btn">タイトルへ</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <audio id="bgm-player" loop></audio>
</body>

</html>
